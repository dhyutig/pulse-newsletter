name: PULSE Newsletter - Monthly Draft

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install anthropic extract_msg

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Restore rclone config from secret
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Debug - check decoded config (no secrets exposed)
        run: |
          echo "Line count:"
          wc -l ~/.config/rclone/rclone.conf
          echo "First line:"
          head -n 1 ~/.config/rclone/rclone.conf

      - name: Pull latest files from Drive
        run: rclone copy gdrive:Newsletter ./raw_files --drive-shared-with-me

      - name: Generate newsletter draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python newsletter_generator.py --input ./raw_files --out ./draft_newsletter.html --force-full

      - name: Commit updated run-state
        run: |
          git config user.name "newsletter-bot"
          git config user.email "actions@github.com"
          git add last_run.json
          git commit -m "Update run state" || echo "No state changes to commit"
          git push

      - name: Email the draft for review
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, base64, urllib.request

          with open("draft_newsletter.html", "r") as f:
              html = f.read()

          payload = {
              "personalizations": [{
                  "to": [
                      {"email": "dhyuti@stanford.edu"},
                  ]
              }],
              "from": {"email": "PULSEinstitute@gmail.com", "name": "PULSE Newsletter"},
              "subject": "PULSE Newsletter Draft - Ready for Review",
              "content": [{"type": "text/html", "value": html}],
          }

          req = urllib.request.Request(
              "https://api.sendgrid.com/v3/mail/send",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SENDGRID_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print("SendGrid response status:", resp.status)
          EOF